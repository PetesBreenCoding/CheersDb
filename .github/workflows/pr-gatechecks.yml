name: PR Gatechecks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-gatechecks:
    permissions:
      pull-requests: write
    name: PR Gatechecks
    runs-on: ubuntu-latest

    steps:
      - name: 🎛️ Checkout
        uses: actions/checkout@v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: 🛠️ Install .NET Tools
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: 🔄 Restore Dependencies
        run: dotnet restore

      - name: 👷 Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Run Unit Tests
        run: dotnet test --no-build --configuration Release --results-directory TestResults --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

      - name: 🚦 Enforce Code Coverage
        shell: pwsh
        run: |
          $branchThreshold = 0.10
          $lineThreshold = 0.20

          $branchThresholdStr = $branchThreshold.ToString('P2')
          $lineThresholdStr = $lineThreshold.ToString('P2')

          [xml]$testCoverage = Get-Content .\TestResults\coverage.cobertura.xml
          $branchRate = [double]$testCoverage.coverage.'branch-rate'
          $lineRate = [double]$testCoverage.coverage.'line-rate'
          $branchRateStr = $branchRate.ToString('P2')
          $lineRateStr = $lineRate.ToString('P2')

          $exitCode = 0

          if ($branchRate -lt $branchThreshold) {
            Write-Host "::error title=Coverage Check Failed::Branch coverage $branchRateStr is below required $branchThresholdStr"
            $exitCode = 1
          }
          else {
            Write-Host "::notice title=Coverage Check Passed::✅ Branch coverage $branchRateStr meets required $branchThresholdStr"
          }

          if ($lineRate -lt $lineThreshold) {
            Write-Host "::error title=Coverage Check Failed::Line coverage $lineRateStr is below required $lineThresholdStr"
            $exitCode = 1
          }
          else {
            Write-Host "::notice title=Coverage Check Passed::✅ Line coverage $lineRateStr meets required $lineThresholdStr"
          }

          exit $exitCode

      - name: 📊 Coverage Report
        shell: pwsh
        run: |
          reportgenerator `
            -reports:TestResults/coverage.cobertura.xml `
            -targetdir:TestResults/CoverageSummary `
            -reporttypes:MarkdownSummaryGithub `
            -title:"Unit Test Code Coverage Report"

          Get-Content ./TestResults/CoverageSummary/SummaryGithub.md | Out-File $env:GITHUB_STEP_SUMMARY -Append