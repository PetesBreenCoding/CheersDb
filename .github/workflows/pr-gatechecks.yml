name: PR Gatechecks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-gatechecks:
    permissions:
      pull-requests: write
    name: PR Gatechecks
    runs-on: ubuntu-latest

    steps:
      - name: 🎛️ Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🔄 Restore
        run: dotnet restore

      - name: 👷 Build
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Run unit tests
        run: dotnet test --no-build --configuration Release

      - name: Coverage
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-coverage
          dotnet-coverage collect "dotnet test --no-build --configuration Release" -f xml -o test-coverage.xml
          $blockCoverageNode = Select-Xml -Path .\test-coverage.xml -XPath "/results/modules/module[@name='CheersDb.Api.dll']/@block_coverage"
          Write-Host "Block coverage for CheersDb.Api.dll: $($blockCoverageNode.Node.Value)"


     

      
