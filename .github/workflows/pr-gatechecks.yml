name: PR Gatechecks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-gatechecks:
    permissions:
      pull-requests: write
    name: PR Gatechecks
    runs-on: ubuntu-latest

    steps:
      - name: 🎛️ Checkout
        uses: actions/checkout@v7

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: 🔄 Restore
        run: dotnet restore

      - name: 👷 Build
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Run unit tests
        run: dotnet test --no-build --configuration Release --results-directory TestResults --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

      - name: 📊 Enforce code coverage
        shell: pwsh
        run: |
          $threshold = 0.05
          $thresholdStr = $threshold.ToString('P2')

          [xml]$testCoverage = Get-Content .\TestResults\coverage.cobertura.xml
          $branchRate = [double]$testCoverage.coverage.'branch-rate'
          $branchRateStr = $branchRate.ToString('P2')

          if ($branchRate -lt $threshold) {
            Write-Host "::error title=Coverage Check Failed::Branch coverage $branchRateStr is below required $thresholdStr"
            exit 1
          }
          else {
            Write-Host "::notice title=Coverage Check Passed::✅ Branch coverage $branchRateStr meets required $thresholdStr"
          }

      - name: ⏫ Upload coverage results
        uses: codecov/codecov-action@v7
        with:
          name: cheersdb-codecoverage
          files: TestResults/coverage.cobertura.xml
          fail_ci_if_error: true
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true