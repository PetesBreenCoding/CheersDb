name: PR Gatechecks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-gatechecks:
    permissions:
      pull-requests: write
    name: PR Gatechecks
    runs-on: ubuntu-latest

    steps:
      - name: 🎛️ Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: 🛠️ Install .NET tools
        run: |
          dotnet tool install --global dotnet-coverage

      - name: 🔄 Restore
        run: dotnet restore

      - name: 👷 Build
        run: dotnet build --no-restore --configuration Release

      - name: 🧪 Run unit tests
        run: dotnet test --no-build --configuration Release --results-directory TestResults --coverage --coverage-output coverage.cobertura.xml --coverage-output-format cobertura

      - name: 📊 Enforce code coverage
        shell: pwsh
        run: |
          $threshold = 0.05

          [xml]$testCoverage = Get-Content .\TestResults\coverage.cobertura.xml
          $apiCoverage = $testCoverage.coverage.packages.package[0]

          Write-Host "Branch coverage: $($branchRate.ToString('P2'))"

          if ($branchRate -lt $threshold) {
            Write-Host "::error title=Coverage Check Failed::Branch coverage $($branchRate.ToString('P2')) is below required $($threshold.ToString('P2'))"
            exit 1
          }