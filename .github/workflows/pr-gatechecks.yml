name: PR Gatechecks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    #name: Build Solution
    runs-on: ubuntu-latest

    steps:
      - name: 🎛️ Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🔄 Restore
        run: dotnet restore

      - name: 👷 Build
        run: dotnet build --no-restore --configuration Release

  #analyze-openapi:
    #name: Analyze OpenAPI Spec
    #runs-on: ubuntu-latest

    #steps:
      - name: 🔍 Analyze OpenAPI
        id: analyze
        uses: ApyGuard/apyguard_openapi_analysis@v1.0.9
        with:
          file: ${{ github.workspace }}/src/CheersDb.Api/CheersDb.Api.json
          output_format: json

      - name: 👮 OpenAPI Analysis Quality Gate
        shell: pwsh
        run: |
            $isValid = '${{ steps.analyze.outputs.is_valid }}'
            $analysisJson = '${{ steps.analyze.outputs.analysis }}'

            if ([string]::IsNullOrEmpty($analysisJson)) {
                Write-Host '❌ OpenAPI analysis produced no analysis output';
                exit 1;
            }

            $analysis = $analysisJson | ConvertFrom-Json
            $performanceCount = $analysis.analysis_categories.performance
            $versioningCount = $analysis.analysis_categories.versioning
            $complianceCount = $analysis.analysis_categories.compliance

            if ($isValid -eq 'true' -and $performanceCount -eq 0 -and $versioningCount -eq 0 -and $complianceCount -eq 0) {
                Write-Host '✔️ OpenAPI analysis passed'
                exit 0
            } else {
                Write-Host '❌ OpenAPI analysis failed'
                Write-Host ($analysis | ConvertTo-Json -Depth 5)
                exit 1
            }
