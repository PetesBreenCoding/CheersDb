name: PR Gatechecks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    #name: Build Solution
    runs-on: ubuntu-latest

    steps:
      - name: 🎛️ Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🔄 Restore
        run: dotnet restore

      - name: 👷 Build
        run: dotnet build --no-restore --configuration Release

  #analyze-openapi:
    #name: Analyze OpenAPI Spec
    #runs-on: ubuntu-latest

    #steps:
      - name: 🔍 Analyze OpenAPI
        id: analyze
        uses: ApyGuard/apyguard_openapi_analysis@v1.0.9
        with:
          file: ${{ github.workspace }}/src/CheersDb.Api/CheersDb.Api.json
          output_format: json

      - name: Display Results
        run: |
          echo "OpenAPI Analysis Results:"
          echo "========================="
          echo ${{ toJSON(steps.analyze.outputs) }}

      - name: 👮 OpenAPI Analysis Quality Gate
        shell: pwsh
        run: |
            $isValid = "${{ steps.analyze.outputs.is_valid }}";
            $suggestionsCount = ${{ steps.analyze.outputs.suggestions_count }};

            if ($isValid -eq "true" -and $suggestionsCount -eq 0) {
              Write-Host "✔️ OpenAPI analysis passed";
              exit 0;
            }
            else {
              Write-Host "❌ OpenAPI analysis failed";
              exit 1;
            }